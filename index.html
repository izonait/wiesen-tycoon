<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Mäh die Wiese, verkaufe Gras und werde Wiesen-Tycoon.">
  <meta name="theme-color" content="#3E8E2F">

  <!-- iPhone: als Web-App auf dem Home-Bildschirm im Vollbild starten -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wiesen-Tycoon">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Wiesen-Tycoon</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #7CC8F2; overscroll-behavior: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center;
      font: 600 18px system-ui, sans-serif; color: #1b3a1d;
      background: linear-gradient(#7CC8F2, #CDEFB5); }
  </style>
</head>
<body>
  <div id="loading">Wiese wird geladen …</div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var l = document.getElementById("loading"); if (l) l.remove();
    });
    // Eigener Service Worker: speichert alle Dateien, damit das Spiel offline startet.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
